name: iOS Build (Unsigned IPA)

on:
  workflow_dispatch:

jobs:
  build-ios:
    name: Build Unsigned iOS IPA
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      # 1. 编译 iOS 为未签名的 IPA
      - name: Build iOS IPA (no codesign)
        run: flutter build ipa --release --no-codesign
        env:
          FLUTTER_SWIFT_PACKAGE_MANAGER: false

      # 2. 打印出生成的 IPA 文件的真实路径，方便我们在日志里查看
      - name: Find IPA file path
        run: find build -name "*.ipa"

      # 3. 上传产物：使用 **/*.ipa 全局搜索，无论它藏在哪个子文件夹都能抓到
      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Runner-unsigned-ipa
          path: "**/*.ipa"
