name: iOS Build (Unsigned IPA)

on:
  workflow_dispatch:

jobs:
  build-ios:
    name: Build Unsigned iOS IPA
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      # 1. 编译为 xcarchive
      - name: Build iOS (no codesign)
        run: flutter build ipa --release --no-codesign
        env:
          FLUTTER_SWIFT_PACKAGE_MANAGER: false

      # 2. 手动从 archive 中提取 .app 并打包成 ipa
      - name: Package unsigned IPA
        run: |
          mkdir -p Payload
          cp -R build/ios/archive/Runner.xcarchive/Products/Applications/Runner.app Payload/
          zip -qry Runner-unsigned.ipa Payload

      # 3. 上传打包好的 ipa
      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Runner-unsigned-ipa
          path: Runner-unsigned.ipa
