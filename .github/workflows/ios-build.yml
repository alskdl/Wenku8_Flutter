name: iOS Build (Unsigned IPA)

on:
  workflow_dispatch:

jobs:
  build-ios:
    name: Build Unsigned iOS IPA
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      # 关键改动：改用 build ios，彻底跳过签名检查，只生成 .app
      - name: Build iOS (no codesign)
        run: flutter build ios --release --no-codesign
        env:
          FLUTTER_SWIFT_PACKAGE_MANAGER: false

      # 手动将编译好的 .app 打包成标准的 .ipa 结构
      - name: Package unsigned IPA
        run: |
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qry Runner-unsigned.ipa Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Runner-unsigned-ipa
          path: Runner-unsigned.ipa
